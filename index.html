<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0F0F0F" />

    <!-- ───────── Primary SEO ───────── -->
    <title>Ramen Lab · Crafted Bowls. Tokyo Soul.</title>
    <meta
      name="description"
      content="Ramen Lab — A cinematic Japanese ramen experience. Twelve-hour broths, hand-pulled noodles, and the obsessive soul of a Shinjuku alley shop."
    />
    <meta name="keywords" content="ramen, tokyo ramen, japanese ramen, tonkotsu, shoyu, miso ramen, ramen subscription, ramen box, shinjuku" />
    <meta name="author" content="Ramen Lab" />
    <link rel="canonical" href="https://ramenlab.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- ───────── Open Graph (Facebook, LinkedIn, iMessage previews) ───────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ramen Lab" />
    <meta property="og:title" content="Ramen Lab · Crafted Bowls. Tokyo Soul." />
    <meta property="og:description" content="A cinematic Japanese ramen experience. Twelve-hour broths, hand-pulled noodles, Shinjuku soul." />
    <meta property="og:url" content="https://ramenlab.com/" />
    <meta property="og:image" content="https://ramenlab.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Steaming bowl of tonkotsu ramen lit by crimson light" />
    <meta property="og:locale" content="en_US" />

    <!-- ───────── Twitter / X ───────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ramenlab" />
    <meta name="twitter:title" content="Ramen Lab · Crafted Bowls. Tokyo Soul." />
    <meta name="twitter:description" content="A cinematic Japanese ramen experience. Twelve-hour broths, hand-pulled noodles, Shinjuku soul." />
    <meta name="twitter:image" content="https://ramenlab.com/og-image.jpg" />

    <!-- ───────── Icons ───────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ───────── Structured Data (JSON-LD) ─────────
         schema.org Restaurant — swap for `Product` / `Organization` when
         the brand pivots to a subscription box. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Ramen Lab",
        "description": "A cinematic Japanese ramen experience. Twelve-hour broths, hand-pulled noodles, Shinjuku soul.",
        "url": "https://ramenlab.com/",
        "image": "https://ramenlab.com/og-image.jpg",
        "telephone": "+81-3-1234-5678",
        "priceRange": "$$",
        "servesCuisine": ["Japanese", "Ramen"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "3-7-2 Nishi-Shinjuku",
          "addressLocality": "Tokyo",
          "postalCode": "160-0023",
          "addressCountry": "JP"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "17:00",
            "closes": "00:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday"],
            "opens": "17:00",
            "closes": "02:00"
          }
        ],
        "sameAs": [
          "https://instagram.com/ramenlab",
          "https://tiktok.com/@ramenlab",
          "https://x.com/ramenlab",
          "https://youtube.com/@ramenlab"
        ]
      }
    </script>

    <!-- ───────── Resource hints ───────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600;700&family=Fredoka+One&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink text-bone">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
